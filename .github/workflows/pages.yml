name: Deploy static Text Lab demo

# Publishes docs/ to GitHub Pages. The page is a frozen snapshot: it carries
# real model outputs for the built-in example and needs no backend.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_static_demo.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
