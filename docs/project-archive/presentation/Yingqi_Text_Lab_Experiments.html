<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Lab · Yingqi’s experiments</title>
<style>
:root{--bg:#f3f3f2;--paper:#fff;--ink:#272c2a;--muted:#565f59;--line:#dce1dc;--accent:#245b47;--soft:#e9f2ea;--blue:#4e65a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
header{background:var(--paper);border-bottom:1px solid var(--line)}
header div,main{max-width:1240px;margin:auto;padding-inline:clamp(18px,5vw,64px)}
header div{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:62px}
.brand{font-weight:750;letter-spacing:-.025em;font-size:21px;color:var(--accent)}
a{color:var(--accent);text-underline-offset:3px}
main{padding-block:40px 52px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(32px,5vw,51px);line-height:1.12;letter-spacing:-.05em}
.intro{color:var(--muted);margin:12px 0 24px}
nav{display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
nav button{border:0;border-bottom:3px solid transparent;background:none;padding:12px 2px;font-weight:650;color:var(--muted)}
nav button[aria-pressed=true]{color:var(--accent);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);background:var(--paper);border:1px solid var(--line);border-radius:14px}
.plot,.detail{padding:clamp(20px,3vw,32px);min-width:0}
.detail{border-left:1px solid var(--line);background:#fafbf9;border-radius:0 14px 14px 0}
h2{font-size:23px;letter-spacing:-.025em}
.context,.axis,.small{font-size:14px;color:var(--muted)}
.context{margin:5px 0 18px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
label{font-size:13px;color:var(--muted);display:grid;gap:4px}
select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
.axis{display:flex;justify-content:space-between;margin:0 3px 5px}
.row{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:8px 10px;margin:2px 0}
.row[aria-pressed=true]{background:var(--soft);border-color:#c5d9cc}
.row:hover{border-color:#b4c9bd}
.label{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:15px;font-weight:650}
.value,.big,td{font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:3px;background:#edf0ed;overflow:hidden;display:block}
.bar{height:100%;background:var(--blue);display:block}
.row[aria-pressed=true] .bar{background:var(--accent)}
.caption{margin-top:16px;color:var(--muted);font-size:14px}
.big{font-size:44px;font-weight:720;letter-spacing:-.045em;color:var(--accent);line-height:1.2;margin:10px 0}
.detail p+p{margin-top:8px}
.detail h3{font-size:16px;margin:22px 0 6px}
dl{display:grid;grid-template-columns:1fr auto;gap:7px 10px;margin:14px 0 0;font-size:14px}
dt{color:var(--muted)}dd{margin:0;font-weight:650}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:right}
th,td{padding:4px;text-align:center} th[scope=row]{text-align:left;white-space:nowrap}
th small{display:block}
footer{font-size:14px;color:var(--muted);margin-top:18px}
@media(max-width:760px){.workspace{grid-template-columns:1fr}.detail{border-left:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px}main{padding-top:28px}nav{gap:14px}}
</style>
</head>

<script>
const evidence=JSON.parse(document.getElementById('evidence').textContent);
const root='https://github.com/Realsbt/ee6405-nlp-project/blob/86e8ac866e8cfbfe55c4640c45d349873b61d193/';
const sameDescriptions=[
  'CLS summary over the shared visible prefix.',
  'Equal-weight averaging of elementary discourse units (EDUs).',
  'Graph with fixed topology and permuted relation labels.',
  'Graph with the original discourse relation labels.'
];
const fusionNames=['CLS only','CLS + EDU mean','CLS + attention','CLS + gated attention'];
const fusionDescriptions=[
  'Global CLS summary with a shared projection and classifier.',
  'Adds the equally weighted EDU context to CLS.',
  'Adds an attention-weighted EDU context to CLS.',
  'Uses a learned scalar gate to control the attention-weighted context added to CLS.'
];
const transfer=[
  {name:'RoBERTa CE',hart:90.75,mix:39.01,description:'Single neural component, seed 3407.'},
  {name:'RACE + SupCon',hart:90.84,mix:33.38,description:'Single graph model, seed 3407.'},
  {name:'Probability blend',hart:92.10,mix:36.86,description:'Blends probabilities from frozen RoBERTa and RACE.'},
  {name:'Stacking',hart:93.61,mix:36.22,description:'Logistic regression over predictions from frozen RoBERTa, RACE and TF-IDF.'}
];
const studies={
  same:{title:'Same-window controls',splits:{test:'HART test',validation:'HART validation'},metrics:{macro_f1:'Macro-F1',accuracy:'Accuracy',minority:'AI-humanized recall'},source:'experiments/reports/same_window/seed_3407',caption:'All four conditions see the same RoBERTa-visible prefix, up to 512 tokens. Seed 3407.'},
  fusion:{title:'Text-EDU validation screening',splits:{validation:'HART validation'},metrics:{f1:'Macro-F1',runtime:'Training run time'},source:'experiments/reports/yingqi_snapshot/fusion/validation_screen.csv',caption:'Four variants from the seed-3407 screening set. Validation scores were used to select the candidate.'},
  transfer:{title:'Frozen-model stacking and transfer',splits:{hart:'HART test',mix:'MixSet subset'},metrics:{f1:'Macro-F1'},source:'docs/YINGQI_STATUS.md',caption:'The MixSet evaluation uses a fixed 359-text subset. The neural components use one underlying seed.'}
};
const $=id=>document.getElementById(id);
const tabs=[...document.querySelectorAll('nav button')];
let study='same', selected=0;
const pct=value=>value.toFixed(2)+'%';
function options(select,entries){
  select.replaceChildren(...Object.entries(entries).map(([value,label])=>new Option(label,value)));
}
function switchStudy(key){
  study=key;
  selected=key==='same'?0:3;
  tabs.forEach(tab=>tab.setAttribute('aria-pressed',tab.dataset.study===key));
  options($('split'),studies[key].splits);
  options($('metric'),studies[key].metrics);
  $('split').disabled=$('split').options.length===1;
  $('metric').disabled=$('metric').options.length===1;
  render();
}
function render(){
  const split=$('split').value, metric=$('metric').value, info=studies[study];
  const rows=study==='same'?evidence.same:study==='fusion'?evidence.fusion:transfer;
  const runtime=metric==='runtime';
  const max=runtime?160:100;
  const format=runtime?value=>value.toFixed(1)+' min':pct;
  const names=study==='fusion'?fusionNames:rows.map(row=>row.name);
  const values=rows.map(row=>{
    if(study==='same'){
      const score=row[split];
      return 100*(metric==='minority'?score.per_class.ai_humanized.recall:score[metric]);
    }
    if(study==='fusion')return runtime?Number(row.run_minutes):100*Number(row.validation_macro_f1);
    return row[split];
  });
  $('chart-title').textContent=info.title;
  $('context').textContent=info.splits[split]+' / '+info.metrics[metric];
  $('axis').innerHTML=runtime?'<span>0</span><span>80</span><span>160 min</span>':'<span>0%</span><span>50%</span><span>100%</span>';
  $('caption').textContent=info.caption;
  $('bars').innerHTML=values.map((value,i)=>'<button class="row" type="button" data-model="'+i+'" aria-pressed="'+(selected===i)+'"><span class="label"><span>'+names[i]+'</span><span class="value">'+format(value)+'</span></span><span class="track" aria-hidden="true"><span class="bar" style="width:'+value/max*100+'%"></span></span></button>').join('');
  const row=rows[selected];
  let details;
  if(study==='same'){
    const result=row[split];
    const labels=['Human','AI-pol.','AI-gen.','AI-hum.'];
    details='<p>'+sameDescriptions[selected]+'</p><dl><dt>Samples</dt><dd>'+result.samples.toLocaleString('en-US')+'</dd><dt>AI-humanized recall</dt><dd>'+pct(100*result.per_class.ai_humanized.recall)+'</dd></dl><h3>Confusion matrix</h3><p class="small">Rows are actual labels. Columns are predictions.</p><table aria-label="Confusion matrix"><thead><tr><th scope="col">Actual</th>'+labels.map(label=>'<th scope="col">'+label+'</th>').join('')+'</tr></thead><tbody>'+result.confusion_matrix.map((counts,i)=>{
      const maxCount=Math.max(...counts);
      return '<tr><th scope="row">'+labels[i]+'</th>'+counts.map(count=>'<td style="background:rgba(36,91,71,'+(.03+.22*count/maxCount)+')">'+count+'</td>').join('')+'</tr>';
    }).join('')+'</tbody></table>';
  }else if(study==='fusion'){
    const gap=(100*(Number(row.validation_macro_f1)-Number(rows[0].validation_macro_f1))).toFixed(2);
    details='<p>'+fusionDescriptions[selected]+'</p><dl><dt>Validation gain vs CLS</dt><dd>+'+gap+' pp</dd><dt>Best epoch</dt><dd>'+row.best_epoch+'</dd><dt>Run time</dt><dd>'+Number(row.run_minutes).toFixed(1)+' min</dd><dt>Trainable parameters</dt><dd>'+Number(row.trainable_parameters).toLocaleString('en-US')+'</dd></dl>';
  }else{
    details='<p>'+row.description+'</p><dl><dt>HART test Macro-F1</dt><dd>'+pct(row.hart)+'</dd><dt>MixSet subset Macro-F1</dt><dd>'+pct(row.mix)+'</dd></dl>';
  }
  $('detail').innerHTML='<h2>'+names[selected]+'</h2><p class="big">'+format(values[selected])+'</p>'+details;
  $('sources').innerHTML='Data source <a href="'+root+info.source+'">Yingqi branch, saved experiment evidence</a>';
}
tabs.forEach(tab=>tab.addEventListener('click',()=>switchStudy(tab.dataset.study)));
$('split').addEventListener('change',render);
$('metric').addEventListener('change',render);
$('bars').addEventListener('click',event=>{
  const button=event.target.closest('[data-model]');
  if(!button)return;
  selected=Number(button.dataset.model);
  render();
  $('bars').querySelector('[data-model="'+selected+'"]').focus();
});
switchStudy('same');
</script>
</body>
</html>
